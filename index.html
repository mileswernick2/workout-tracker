<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Training</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1114;
    --surface: #1a1d22;
    --surface2: #22262d;
    --border: #2e333b;
    --text: #e8e6e1;
    --text2: #8a8d93;
    --accent-run: #e07a4b;
    --accent-bike: #4b9fe0;
    --accent-kayak: #4bc5a0;
    --accent-pickle: #c5c04b;
    --accent-strength: #b04be0;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 10px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { display: none; min-height: 100dvh; padding: calc(var(--safe-top) + 16px) 20px calc(var(--safe-bottom) + 20px); }
  .page.active { display: flex; flex-direction: column; }

  /* ── Landing ── */
  .landing-header {
    text-align: center;
    margin-bottom: 32px;
    padding-top: 12px;
  }
  .landing-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .global-counter {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text2);
    background: var(--surface);
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    margin-top: 8px;
  }

  .category-list { display: flex; flex-direction: column; gap: 12px; }

  .cat-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    -webkit-user-select: none;
    position: relative;
    overflow: hidden;
  }
  .cat-btn:active { transform: scale(0.97); background: var(--surface2); }

  .cat-btn .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .cat-btn .left { display: flex; align-items: center; }
  .cat-btn .days {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    color: var(--text2);
    white-space: nowrap;
  }

  /* ── Detail pages ── */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding-top: 4px;
  }
  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 20px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--surface2); }
  .detail-header h2 { font-size: 22px; font-weight: 700; }

  .form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    flex-grow: 1;
    overflow-y: auto;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: #555; }
  textarea { resize: none; min-height: 120px; line-height: 1.5; }

  /* Strength grid */
  .str-header {
    display: grid;
    grid-template-columns: 1fr 72px 62px;
    gap: 8px;
    margin-bottom: 8px;
  }
  .str-header span {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .str-row {
    display: grid;
    grid-template-columns: 1fr 72px 62px;
    gap: 8px;
    margin-bottom: 6px;
  }
  .str-row input {
    margin-bottom: 0;
    padding: 10px 10px;
    font-size: 15px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    padding-bottom: 8px;
  }
  .btn-save, .btn-history {
    flex: 1;
    padding: 16px;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
  }
  .btn-save:active, .btn-history:active { transform: scale(0.97); opacity: 0.85; }
  .btn-save { background: var(--text); color: var(--bg); }
  .btn-history { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    left: 50%; transform: translateX(-50%) translateY(60px);
    background: #2d3a2d;
    color: #8bdb8b;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 30px;
    opacity: 0;
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), opacity 0.35s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* History modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 75dvh;
    padding: 20px 20px calc(var(--safe-bottom) + 20px);
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    padding: 12px;
    width: 100%;
    cursor: pointer;
    margin-top: 12px;
    font-family: 'DM Sans', sans-serif;
  }

  .hist-entry {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .hist-date {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .hist-detail { font-size: 14px; line-height: 1.55; color: var(--text); }
  .hist-detail span.hl { color: var(--text2); font-size: 12px; }
  .hist-none { text-align: center; color: var(--text2); font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>

<!-- Landing Page -->
<div id="page-landing" class="page active">
  <div class="landing-header">
    <h1>Daily Training</h1>
    <div class="global-counter" id="global-counter">Last workout: Never</div>
  </div>
  <div class="category-list" id="cat-list"></div>
</div>

<!-- Detail Pages (generated by JS) -->
<div id="page-detail" class="page">
  <div class="detail-header">
    <div class="back-btn" id="btn-back">←</div>
    <h2 id="detail-title"></h2>
  </div>
  <div class="form-section" id="form-area"></div>
  <div class="actions">
    <button class="btn-history" id="btn-hist">History</button>
    <button class="btn-save" id="btn-save">Save</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">Saved ✓</div>

<!-- History Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">History</h3>
    <div id="modal-body"></div>
    <button class="modal-close" id="modal-close">Close</button>
  </div>
</div>

<script>
const CATS = [
  { id: 'running', name: 'Running', color: '#e07a4b', type: 'running' },
  { id: 'biking', name: 'Biking', color: '#4b9fe0', type: 'freetext' },
  { id: 'kayaking', name: 'Kayaking', color: '#4bc5a0', type: 'freetext' },
  { id: 'pickleball', name: 'Pickleball', color: '#c5c04b', type: 'freetext' },
  { id: 'strength', name: 'Strength', color: '#b04be0', type: 'strength' },
];

const RUNNING_FIELDS = [
  { key: 'intervals', label: 'Interval Description' },
  { key: 'time', label: 'Time' },
  { key: 'miles', label: 'Miles' },
  { key: 'pace', label: 'Pace' },
];

const STR_ROWS = 10;
let currentCat = null;

// ── Storage helpers ──
function getLog(catId) {
  try { return JSON.parse(localStorage.getItem('wt_' + catId) || '[]'); }
  catch { return []; }
}
function saveLog(catId, log) {
  localStorage.setItem('wt_' + catId, JSON.stringify(log));
}
function getLastEntry(catId) {
  const log = getLog(catId);
  return log.length ? log[log.length - 1] : null;
}

// ── Day math ──
function daysAgo(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now.setHours(0,0,0,0) - d.setHours(0,0,0,0)) / 86400000);
  return diff;
}
function daysLabel(n) {
  if (n === null) return 'Never';
  if (n === 0) return 'Today';
  if (n === 1) return '1 day ago';
  return n + ' days ago';
}

// ── Render landing ──
function renderLanding() {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  let globalMin = null;

  CATS.forEach(cat => {
    const last = getLastEntry(cat.id);
    const d = last ? daysAgo(last.date) : null;
    if (d !== null && (globalMin === null || d < globalMin)) globalMin = d;

    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `
      <div class="left">
        <div class="dot" style="background:${cat.color}"></div>
        ${cat.name}
      </div>
      <span class="days">${daysLabel(d)}</span>
    `;
    btn.addEventListener('click', () => openDetail(cat.id));
    list.appendChild(btn);
  });

  document.getElementById('global-counter').textContent =
    'Last workout: ' + daysLabel(globalMin);
}

// ── Open detail ──
function openDetail(catId) {
  currentCat = CATS.find(c => c.id === catId);
  const last = getLastEntry(catId);

  document.getElementById('detail-title').textContent = currentCat.name;
  const area = document.getElementById('form-area');
  area.innerHTML = '';

  if (currentCat.type === 'running') {
    RUNNING_FIELDS.forEach(f => {
      area.innerHTML += `<label>${f.label}</label>
        <input type="text" id="f_${f.key}" value="${last && last.data[f.key] ? last.data[f.key] : ''}" inputmode="${f.key === 'intervals' ? 'text' : 'decimal'}">`;
    });
  } else if (currentCat.type === 'freetext') {
    area.innerHTML += `<label>Notes</label>
      <textarea id="f_notes">${last && last.data.notes ? last.data.notes : ''}</textarea>`;
  } else if (currentCat.type === 'strength') {
    area.innerHTML += `<div class="str-header"><span>Exercise</span><span>Weight</span><span>Reps</span></div>`;
    for (let i = 0; i < STR_ROWS; i++) {
      const prev = last && last.data.rows && last.data.rows[i] ? last.data.rows[i] : { name: '', weight: '', reps: '' };
      area.innerHTML += `<div class="str-row">
        <input type="text" id="s_name_${i}" value="${prev.name}">
        <input type="text" id="s_wt_${i}" value="${prev.weight}" inputmode="decimal">
        <input type="text" id="s_reps_${i}" value="${prev.reps}" inputmode="numeric">
      </div>`;
    }
  }

  document.getElementById('page-landing').classList.remove('active');
  document.getElementById('page-detail').classList.add('active');
}

// ── Save ──
document.getElementById('btn-save').addEventListener('click', () => {
  if (!currentCat) return;
  const entry = { date: new Date().toISOString().slice(0, 10), data: {} };

  if (currentCat.type === 'running') {
    RUNNING_FIELDS.forEach(f => {
      entry.data[f.key] = document.getElementById('f_' + f.key).value;
    });
  } else if (currentCat.type === 'freetext') {
    entry.data.notes = document.getElementById('f_notes').value;
  } else if (currentCat.type === 'strength') {
    entry.data.rows = [];
    for (let i = 0; i < STR_ROWS; i++) {
      entry.data.rows.push({
        name: document.getElementById('s_name_' + i).value,
        weight: document.getElementById('s_wt_' + i).value,
        reps: document.getElementById('s_reps_' + i).value,
      });
    }
  }

  const log = getLog(currentCat.id);
  log.push(entry);
  saveLog(currentCat.id, log);

  // Toast
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
});

// ── Back ──
document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('page-detail').classList.remove('active');
  document.getElementById('page-landing').classList.add('active');
  renderLanding();
});

// ── History ──
document.getElementById('btn-hist').addEventListener('click', () => {
  if (!currentCat) return;
  const log = getLog(currentCat.id);
  const body = document.getElementById('modal-body');
  document.getElementById('modal-title').textContent = currentCat.name + ' History';
  body.innerHTML = '';

  if (!log.length) {
    body.innerHTML = '<div class="hist-none">No entries yet</div>';
  } else {
    const recent = log.slice().reverse().slice(0, 30);
    recent.forEach(e => {
      const div = document.createElement('div');
      div.className = 'hist-entry';
      let detail = '';

      if (currentCat.type === 'running') {
        RUNNING_FIELDS.forEach(f => {
          if (e.data[f.key]) detail += `<span class="hl">${f.label}:</span> ${e.data[f.key]}<br>`;
        });
      } else if (currentCat.type === 'freetext') {
        detail = (e.data.notes || '').replace(/\n/g, '<br>');
      } else if (currentCat.type === 'strength') {
        (e.data.rows || []).forEach(r => {
          if (r.name) detail += `${r.name} — ${r.weight || '—'} × ${r.reps || '—'}<br>`;
        });
      }
      div.innerHTML = `<div class="hist-date">${e.date}</div><div class="hist-detail">${detail || '<em style="color:var(--text2)">Empty</em>'}</div>`;
      body.appendChild(div);
    });
  }

  document.getElementById('modal-overlay').classList.add('show');
});

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
});
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('show');
});

// ── Init ──
renderLanding();
</script>
</body>
</html>
